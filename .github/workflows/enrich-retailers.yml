name: Web Enrich Retailers

on:
  # Run manually from the Actions tab
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max companies to search (blank = all)'
        required: false
        default: ''

  # Or run after the main retailer script pushes new data
  push:
    paths:
      - 'france_retailers.xlsx'

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run web enrichment agent
        run: |
          LIMIT_ARG=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            LIMIT_ARG="--limit ${{ github.event.inputs.limit }}"
          fi
          python web_enrich_agent.py $LIMIT_ARG

      - name: Upload enriched Excel
        uses: actions/upload-artifact@v4
        with:
          name: enriched-retailers
          path: france_retailers_enriched.xlsx

      - name: Commit enriched file (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add france_retailers_enriched.xlsx web_enrich_cache.json
          git diff --staged --quiet || git commit -m "Auto-enrich retailers with web data"
          git push || true
