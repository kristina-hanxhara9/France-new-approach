name: Web Enrich Retailers

on:
  # Run manually from the Actions tab — designed to be triggered by
  # a Copilot agent or manually after the agent has finished searching
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run: prepare, compile, or status'
        required: true
        default: 'compile'
      limit:
        description: 'For prepare: max companies to queue (blank = all)'
        required: false
        default: ''

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run web enrichment command
        run: |
          CMD="${{ github.event.inputs.command }}"
          if [ "$CMD" = "prepare" ]; then
            LIMIT_ARG=""
            if [ -n "${{ github.event.inputs.limit }}" ]; then
              LIMIT_ARG="--limit ${{ github.event.inputs.limit }}"
            fi
            python web_enrich_agent.py prepare $LIMIT_ARG
          elif [ "$CMD" = "compile" ]; then
            python web_enrich_agent.py compile
          elif [ "$CMD" = "status" ]; then
            python web_enrich_agent.py status
          fi

      - name: Upload output
        uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.command == 'compile' }}
        with:
          name: enriched-retailers
          path: france_retailers_enriched.xlsx

      - name: Commit results (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto: web enrichment update"
          git push || true
